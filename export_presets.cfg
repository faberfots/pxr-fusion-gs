[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.ply,*.gsres,*.onnx,rust/spatial_ml/models/*.json,rust/spatial_ml/models/LICENSE-*.txt,rust/spatial_ml/bin/windows/runtime/*.dll,rust/spatial_ml/bin/windows/runtime/*.txt,modules/spatial_intelligence/models/*.json,modules/spatial_intelligence/models/*.txt,assets/legal/*.json,assets/legal/*.txt"
; The unused legacy add-on declares VirtualJoystick, now a Godot 4.7 native class.
; Keep its source for older projects; the application never references it.
exclude_filter="resources/*,rust/spatial_ml/target/*,docs/*,tools/*,*.backup,*.boundaries,addons/virtual_joystick/*"
export_path="build/GSViewer.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
imgui/debug=true
imgui/release=true
