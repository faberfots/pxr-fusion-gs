[plugin]

name="Smart Camera Switcher"
description="A beautiful, intuitive camera switching system with modern UI. Features smooth transitions, auto-discovery, and flexible configuration. Perfect for games with multiple camera angles."
author="Smart Camera Switcher Contributors"
version="1.0.1"
script="plugin.gd"

[dependencies]

godot="4.5"

[configuration]

# Default settings that can be overridden in project settings
default_activation_key="mouse_right"
default_ui_style="buttons"
default_transition_duration=0.5
default_auto_hide_delay=3.0
default_enable_shortcuts=true
default_auto_register=true