name: Godot qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    name: Linux software Vulkan (disabled and native 4x MSAA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and report integrity
        run: |
          python tools/check_source.py
          python tools/audit_status.py --check
      - name: Headless source qualification
        run: |
          python tools/run_checks.py --godot godot --candidate /tmp/gs-ci
          python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --script res://tests/cortex_settings_checks.gd
          python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --script res://tests/cortex_presets_checks.gd
          python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --script res://tests/cortex_transport_checks.gd
      - name: Provider transport lifecycle (local synthetic server)
        run: python tools/check_provider_network.py --godot godot --project /tmp/gs-ci
      - name: Install software Vulkan and display
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Vulkan rendering and lifecycle
        shell: bash
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -iname '*lvp*' | head -1)"
          test -n "$VK_ICD_FILENAMES"
          for suite in startup_checks camera_lifecycle_checks gpu_checks lifecycle_checks rendering_checks migration_recovery_checks spatial_checks selection_color_checks color_transform_checks studio_checks hybrid_checks shadow_checks; do
            xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --timeout 300 --script "res://tests/$suite.gd"
          done
          for suite in loading_gpu_checks loading_checkpoint_checks loading_parallel_checks loading_scheduler_checks loading_cache_checks; do
            xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --timeout 300 --script "res://tests/$suite.gd"
          done
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/loading_progressive_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/composition_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/composition_lifecycle_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 960x648 --script res://tests/grid_shadow_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/ui_scale_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1908x960 --script res://tests/ui_scale_checks.gd
          for resolution in 1142x648 1908x960; do
            for suite in launcher_drag_checks placement_checks; do
              xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution "$resolution" --script "res://tests/$suite.gd"
            done
          done
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/placement_routes_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/environment_import_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/sky_controls_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/cortex_ui_checks.gd
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --resolution 1142x648 --script res://tests/cortex_presets_ui_checks.gd
          python tools/make_spatial_fixture.py /tmp/spatial-ci.ply --count 40000
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --disable-msaa --gpu --script res://tests/spatial_async_checks.gd --test-arg /tmp/spatial-ci.ply --test-arg 40000
      - name: Native software MSAA depth (runtime selects supported 4x)
        shell: bash
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -iname '*lvp*' | head -1)"
          xvfb-run -a python tools/run_checks.py --godot godot --candidate /tmp/gs-ci --skip-import --gpu --timeout 300 --script res://tests/rendering_checks.gd
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-godot-logs
          path: /tmp/gs-ci/.godot
          include-hidden-files: true
          retention-days: 7
  native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true
      - name: Configure native compiler
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: 'Join-Path $env:MSYS2_LOCATION "mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Reproduce native runtime and build
        run: python tools/setup_native_ml.py --build
      - name: Real GDScript native inference
        run: python tools/run_checks.py --godot godot --script res://tests/native_inference_checks.gd
      - name: Native CLIP token contract
        run: python tools/run_checks.py --godot godot --script res://tests/cortex_tokenizer_checks.gd
      - name: Package and start the official optimized Windows template
        shell: pwsh
        run: |
          $template = Join-Path $env:APPDATA 'Godot/export_templates/4.6.2.stable/windows_release_x86_64.exe'
          if (-not (Test-Path -LiteralPath $template)) { throw 'Official release template missing' }
          $engine = (Get-Command godot).Source
          python tools/package_candidate.py --godot $engine --engine $template --engine-kind release-template --output build/ci-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_packaged_startup.py --package build/ci-release
      - name: Upload release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-qualification
          path: |
            build/ci-release/*.log
            build/ci-release/*receipt.json
          retention-days: 14
